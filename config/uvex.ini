# =============================================================================
# UVEX, NUV band.
#
# Settings of the UVEX comparison run of the paper: the same events, window
# and kilonova as ULTRASAT, with the source integrated through the UVEX NUV
# band. A blank value, or "none", keeps the step's default and omits the
# corresponding m4opt flag.
# =============================================================================

[download]
# Pinned Zenodo record of the observing-scenario archive, not the concept DOI.
record    = 22550048
file_name = runs.zip

[scenarios]
zip            = data/runs.zip
subdir         = runs
pop            = fullpop
runs           = O5a O5b O5c
detectors      =                 # the detector network is part of the run label
mass_threshold = 3.0

[paths]
# data_dir holds the inputs shared by the three runs: runs.zip,
# observing-scenarios.ecsv and skymaps/. out_dir holds everything one run
# produces: schedules/, progress/, logs/ and the final table.
data_dir    = data
out_dir     = output/uvex
skymap_dir  = skymaps
sched_dir   = schedules
prog_dir    = progress
log_dir     = logs
event_table = observing-scenarios.ecsv
output_file = uvex.ecsv

[mission]
mission  = uvex
bandpass = NUV
skygrid  =                       # UVEX has a single pointing grid
nside    = 128

[kilonova]
absmag_mean  = -15.6
absmag_stdev = 1.3

[scheduling]
snr         = 5
delay       = 15min
deadline    = 6hour
exptime_min = 300                # seconds
exptime_max = inf                # seconds; inf leaves it unconstrained
cutoff      = 0.1
visits      = 2
cadence     = 30min
appmag_dist = true
# Left unset: the paper's UVEX run keeps m4opt's own default.
max_fields  =

[solver]
timelimit = 6hour
memory    = 30GiB                # caps the CPLEX node file, not the whole job
jobs      = 0                    # threads per solve; 0 = all cores

[execution]
backend = condor                 # condor | slurm | parallel | dask
n_cores = 10                     # parallel backend only

[condor]
accounting_group = ligo.dev.o4.cbc.pe.bayestar
max_hours        = 24
# Starting floors for the whole job (model build and CPLEX), not the solver
# cap above. A job held for exceeding either limit is released and re-requests
# growth_factor ** NumJobStarts times the floor, up to the ceilings below.
# max_request_memory must stay under the RAM of the largest slot in the pool:
#   condor_status -af Memory | sort -n | tail -1
request_memory     = 40000 MB
request_disk       = 20000 MB
max_request_memory = 200000 MB
max_request_disk   = 100000 MB
max_retries        = 3
growth_factor      = 2.0

[slurm]
partition   = cpu
account     =
mem         = 30G
time        = 12:00:00
cpus        = 1
mail_user   =
max_running = 10                 # concurrent tasks per array
max_array   = 1000               # tasks per array job
